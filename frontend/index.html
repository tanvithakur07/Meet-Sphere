<!DOCTYPE html>
<!-- frontend/index.html — Entry point: redirects to login or dashboard -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <title>MeetSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: grid; place-items: center; overflow: hidden; color: #fff;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            background: radial-gradient(900px 600px at 15% 0%, #8B5CF6 0%, transparent 60%),
                        radial-gradient(800px 600px at 100% 100%, #22D3EE 0%, transparent 55%),
                        linear-gradient(145deg, #3B46D6, #5B3FD9);
        }
        .splash { text-align: center; animation: pop .7s cubic-bezier(.2,.8,.2,1) both; }
        .logo {
            width: 92px; height: 92px; margin: 0 auto 1.4rem; border-radius: 28px; display: grid; place-items: center; font-size: 2.8rem;
            background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(10px);
            box-shadow: 0 24px 50px rgba(10,10,60,.35); position: relative;
        }
        .logo::after { content: ''; position: absolute; inset: -10px; border-radius: 36px; border: 2px solid rgba(255,255,255,.3); animation: ring 1.8s ease-out infinite; }
        .name { font-size: 2.4rem; font-weight: 500; letter-spacing: -.03em; }
        .name b { font-weight: 800; }
        .logo svg { width: 54px; height: 54px; color: #fff; }
        .logo svg .core { fill: #2DD4BF; }
        .sub { font-size: 1rem; opacity: .85; margin-top: .4rem; }
        .bar { width: 140px; height: 4px; margin: 2rem auto 0; border-radius: 99px; background: rgba(255,255,255,.25); overflow: hidden; }
        .bar::after { content: ''; display: block; height: 100%; width: 40%; border-radius: 99px; background: #fff; animation: load 1.1s ease-in-out infinite; }
        @keyframes pop { from { opacity: 0; transform: scale(.9) translateY(10px); } }
        @keyframes ring { from { opacity: 1; transform: scale(.92); } to { opacity: 0; transform: scale(1.25); } }
        @keyframes load { from { transform: translateX(-120%); } to { transform: translateX(380%); } }
    </style>
</head>
<body>
    <div class="splash">
        <div class="logo"><svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M26.87 7.75A16.5 16.5 0 0 1 40.50 24.00"/><path d="M36.64 34.61A16.5 16.5 0 0 1 15.75 38.29"/><path d="M8.50 29.64A16.5 16.5 0 0 1 15.75 9.71"/></g><circle class="core" cx="24" cy="24" r="5"/></svg></div>
        <div class="name">Meet<b>Sphere</b></div>
        <div class="sub">Connecting People, Effortlessly</div>
        <div class="bar"></div>
    </div>

    <script>
        // Check if user is already logged in (has a JWT in localStorage)
        const token = localStorage.getItem('meetsphere_token');
        setTimeout(() => {
            if (token) {
                window.location.href = 'pages/dashboard.html';
            } else {
                window.location.href = 'pages/login.html';
            }
        }, 1200);
    </script>
</body>
</html>
