# backend/src/main/resources/application.properties
#
# SECRETS ARE NOT STORED IN THIS FILE.
# Provide them with environment variables (DB_USERNAME, DB_PASSWORD, JWT_SECRET)
# or with a local, git-ignored file: backend/application-local.properties
# (copy application-local.properties.example and fill it in).

# Optional local override file, loaded from the directory you run Maven in (backend/)
spring.config.import=optional:file:./application-local.properties

# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── MySQL ────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/meetsphere_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ──────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT (must be at least 32 characters) ─────────────────────
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=86400000

# ── CORS + WebSocket origins — add EVERY origin you open the frontend from ──
# Normal use: http://localhost:8080 (Spring Boot serves the frontend itself). The :5500 / :3000 entries only matter
# if you still open the pages through VS Code Live Server or another dev server.
# (e.g. add http://192.168.1.20:5500 if you test from another device on your LAN)
app.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:3000

# ── Logging ──────────────────────────────────────────────────
logging.level.com.meetsphere=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.socket=INFO

# ── Email: meeting invitations (SMTP) ────────────────────────
# NO real credentials here. They come from environment variables (see README → "Email invitations").
# Defaults below are for Gmail: MAIL_USERNAME = your Gmail address, MAIL_PASSWORD = a Google *App Password*
# (needed when 2-step verification is on — never your normal Google password).
# Other providers: set MAIL_HOST / MAIL_PORT (587 + STARTTLS), e.g. smtp.office365.com
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Sender shown to recipients. Leave empty to use MAIL_USERNAME (Gmail only allows your own address / verified aliases).
app.mail.from=${MAIL_FROM:}

# Public address of the application — used to build the "Join Meeting" link in the email:
#   <base>/pages/meeting.html?code=<meeting code>
# Locally Spring Boot serves the frontend too, so this is http://localhost:8080. For a deployment set
# APP_FRONTEND_URL to the real domain (e.g. https://meet.example.com).
app.frontend.base-url=${APP_FRONTEND_URL:http://localhost:8080}
